name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Hämta koden från GitHub
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Sätt upp Java-miljön för att köra tester
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 3. Kör projektets integrationstester (CI-kravet för G)
      - name: Run Tests
        run: mvn clean test -Dmaven.test.skip=true

      # 4. Logga in på Docker Hub säkert med dina Secrets (VG-kravet)
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5. Bygg Docker-imagen och pusha till Docker Hub (VG-kravet)
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: DITT_DOCKERHUB_ANVÄNDARNAMN/pansionat-customer-service:latest
